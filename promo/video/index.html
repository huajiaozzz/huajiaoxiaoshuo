  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="./styles.css" />

<body>
  <main class="shell">
    <header class="top">
      <a class="brand" href="../index.html">
        <span class="brand-mark">椒</span>
        <span class="brand-name">花椒写作</span>
        <em>产品宣传片</em>
      </a>
      <div class="top-actions">
        <button class="btn" id="btn-cc" aria-pressed="true">字幕</button>
        <button class="btn" id="btn-loop" aria-pressed="false">循环</button>
        <button class="btn btn-primary" id="btn-export">导出 MP4</button>
      </div>
    </header>

    <section class="stage-wrap">
      <canvas id="stage" width="1920" height="1080" aria-label="花椒写作宣传片画面"></canvas>
      <div class="overlay" id="overlay" hidden>
        <div class="overlay-card">

            <button class="link" id="btn-cancel">取消</button>
          </div>
        </div>
      </div>
    </section>

    <section class="transport">
      <button class="play" id="btn-play" aria-label="播放 / 暂停">▶</button>
      <div class="time"><span id="time-cur">0:00</span><span class="sep">/</span><span id="time-dur">1:00</span></div>

        <div class="track-fill" id="track-fill"></div>
        <div class="ticks" id="ticks"></div>

    <nav class="scenes" id="scenes"></nav>
