name: desktop

# 打 v* tag 时自动编 Mac / Windows 安装包，挂到对应的 Release 附件里；
# 也可以在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action 要创建 Release 并上传附件，默认的只读 token 不够
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: install frontend deps
        run: npm ci
      - name: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "花椒写作 ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}
