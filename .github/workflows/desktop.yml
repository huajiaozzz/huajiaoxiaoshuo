name: desktop

# 打 v* tag 时自动编 Mac / Windows 安装包并挂到对应 Release。
#
# 为什么不用 tauri-action：它内部跑的是 `npm run tauri build`，而 package.json 里的
# tauri 脚本曾经是 "tauri dev"，于是在 CI 上启动了开发模式（vite dev server + debug
# 版应用挂在无头的 runner 上），零输出直到被超时杀掉，两个平台都复现。
# 这里改成自己跑 npx tauri build + gh release upload，不经过 npm 脚本转发，每步日志可见。
#
# 手动触发（workflow_dispatch）用于补传：代码已在某分支上、但那个版本的 Release 还缺
# 安装包时，填 tag 输入项（如 v0.13.1），构建当前分支代码并把产物挂到那个 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要上传到的 Release tag（不填则用触发时的分支/标签名）"
        required: false
        type: string

# gh release upload 需要写 Release 的权限
permissions:
  contents: write

jobs:
  build:
    # 无缓存时 Windows 全量编 Rust 约 20-40 分钟（345 个 crate 的 debug 版 3 分多钟，
    # release 版会慢几倍）；缓存只在 job 成功后由 rust-cache 保存，失败/超时的 run 攒不下缓存
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: install frontend deps
        run: npm ci
      - name: build frontend
        run: npm run build
      - name: verify dist exists
        run: node -e "require('fs').accessSync('dist/index.html'); console.log('dist ok')"
      - name: build tauri
        run: npx tauri build
      - name: upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          # Release 正文由 npm run release 生成；万一没提前发，这里兜底建一个
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "花椒写作 $TAG" --generate-notes
          # 产物里必须有安装包，否则说明 build 步骤没产出 bundle，静默跳过会让人以为传好了
          files=$(find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' \))
          if [ -z "$files" ]; then
            echo "no bundle artifacts found" >&2
            exit 1
          fi
          # 中文文件名在上传时会被截断，先复制成 ASCII 名再传
          #（gh release upload 不支持重命名，只有 # 显示标签，改的是展示名不是文件名）
          echo "$files" | while read -r f; do
            dir=$(dirname "$f")
            en=$(basename "$f" | sed 's/花椒写作/huajiaowriter/')
            cp "$f" "$dir/$en"
            echo "uploading $en"
            gh release upload "$TAG" "$dir/$en" --repo "$GITHUB_REPOSITORY" --clobber
          done
          echo "uploaded:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
